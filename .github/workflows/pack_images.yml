name: Pack images

# Downloads Wizards' product shots for the sets in tools/pack_images.txt and writes the Play Booster wrappers and the
# Prerelease Pack box to draft/packs/<set>/ (tools/get_pack_images.py), for the Draft Table's sealed mode.
# Runs when that list or the script changes, and from "Run workflow". The sandbox cannot reach media.wizards.com.

on:
  push:
    branches: [main]
    paths: [tools/pack_images.txt, tools/get_pack_images.py, .github/workflows/pack_images.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pack-images
  cancel-in-progress: false

jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get the pack images
        run: |
          pip install --quiet pillow
          python3 tools/get_pack_images.py | tee "$RUNNER_TEMP/packs.txt"
          while IFS= read -r line; do echo "::notice::$line"; done < "$RUNNER_TEMP/packs.txt"

      - name: Commit and push if anything changed
        id: push
        run: |
          if [ -z "$(git status --porcelain -- draft/packs)" ]; then echo "Pack images unchanged."; exit 0; fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draft/packs
          git commit -m "Pack images from Wizards' product shots, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          echo "Could not push."; exit 1

      - name: Ask GitHub Pages to publish
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
