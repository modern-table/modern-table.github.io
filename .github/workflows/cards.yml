name: Build card data

# Downloads Scryfall's "Oracle Cards" bulk file, writes src/cards.json (the cards of the built-in decks,
# see tools/make_cards.py), rebuilds the pages and pushes them, so the tournament decks need no Scryfall lookups.
# Runs when the decklists change, every day (so a bad day at Scryfall fixes itself the next), and from "Run workflow".
# Scryfall asks for this approach instead of many card lookups: https://scryfall.com/docs/api/bulk-data

on:
  push:
    branches: [main]
    paths: [src/decks.txt, src/extra.txt, src/aliases.txt, tools/make_cards.py, tools/make_draft_cards.py, draft/cards/targets.txt, .github/workflows/cards.yml, .github/scripts/bulk_uri.py]
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: card-data
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Scryfall's Oracle Cards bulk file
        run: |
          set +e
          trap 'echo "::error::Download step failed at line $LINENO (exit $?)"' ERR
          UA="ModernTable/1.0 (+https://modern-table.github.io/)"
          META="$RUNNER_TEMP/meta.json"
          # Scryfall sometimes answers 5xx for a while: try up to 6 times, 2 minutes apart
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o "$META" -w '%{http_code}' -H "User-Agent: $UA" -H "Accept: application/json" https://api.scryfall.com/bulk-data/oracle-cards || echo "000")
            [ "$CODE" = "200" ] && python3 .github/scripts/bulk_uri.py "$META" > /dev/null 2>&1 && break
            echo "::warning::Try $i: bulk-data list answered HTTP $CODE"; [ $i -lt 6 ] && sleep 120
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::Scryfall bulk-data list answered HTTP $CODE: $(head -c 300 "$META" 2>/dev/null | tr '\n' ' ')"; exit 1
          fi
          echo "::notice::Bulk-data list: HTTP $CODE, $(head -c 200 "$META" | tr '\n' ' ')"
          URI=$(python3 .github/scripts/bulk_uri.py "$META" 2>&1)
          case "$URI" in https://*) ;; *) echo "::error::Could not read download_uri: $URI"; exit 1;; esac
          echo "::notice::Downloading $URI"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sSL -o "$RUNNER_TEMP/oracle-cards.json" -w '%{http_code}' -H "User-Agent: $UA" -H "Accept: */*" "$URI" || echo "000")
            [ "$CODE" = "200" ] && break
            echo "::warning::Try $i: bulk file answered HTTP $CODE"; [ $i -lt 6 ] && sleep 120
          done
          SIZE=$(stat -c %s "$RUNNER_TEMP/oracle-cards.json" 2>/dev/null || echo 0)
          if [ "$CODE" != "200" ]; then
            echo "::error::Bulk file download answered HTTP $CODE ($SIZE bytes): $(head -c 300 "$RUNNER_TEMP/oracle-cards.json" | tr '\n' ' ')"; exit 1
          fi
          if [ "$(head -c 2 "$RUNNER_TEMP/oracle-cards.json" | od -An -tx1 | tr -d ' ')" = "1f8b" ]; then
            mv "$RUNNER_TEMP/oracle-cards.json" "$RUNNER_TEMP/oracle-cards.json.gz" && gunzip "$RUNNER_TEMP/oracle-cards.json.gz"
            SIZE=$(stat -c %s "$RUNNER_TEMP/oracle-cards.json")
          fi
          echo "::notice::Bulk file: $SIZE bytes"

      - name: Write src/cards.json and rebuild
        shell: bash
        run: |
          python3 tools/make_cards.py "$RUNNER_TEMP/oracle-cards.json" | tee "$RUNNER_TEMP/cards.txt"
          echo "::notice::$(head -1 "$RUNNER_TEMP/cards.txt"); $(grep 'not found' "$RUNNER_TEMP/cards.txt" | tail -n +2 | head -20 | tr '\n' ';')"
          python3 build.py | tail -2

      - name: Write draft/cards (card text for the Draft Table sets and cubes in draft/cards/targets.txt)
        shell: bash
        run: |
          # Names come from Scryfall's search (a few pages per set), text from the bulk file. A failure here
          # must not stop src/cards.json from being pushed, so it only warns.
          if python3 tools/make_draft_cards.py "$RUNNER_TEMP/oracle-cards.json" > "$RUNNER_TEMP/draft.txt" 2>&1; then
            while IFS= read -r line; do echo "::notice::draft cards $line"; done < "$RUNNER_TEMP/draft.txt"
          else
            echo "::warning::make_draft_cards.py failed: $(tail -3 "$RUNNER_TEMP/draft.txt" | tr '\n' ' ')"
            git checkout -- draft/cards 2>/dev/null || true
          fi

      - name: Commit and push if anything changed
        id: push
        run: |
          if git diff --quiet -- src/cards.json index.html draft/cards && [ -z "$(git status --porcelain -- src/cards.json draft/cards)" ]; then
            echo "Card data unchanged."; exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cards.json index.html draft/index.html draft/cards
          git commit -m "Card data from Scryfall's bulk file, $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --strategy-option=theirs origin main && python3 build.py > /dev/null && git add index.html draft/index.html \
              && (git diff --cached --quiet || git commit -m "Rebuild after rebase") && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "Could not push."; exit 1

      - name: Ask GitHub Pages to publish (pushes made by this job may not start a Pages build by themselves)
        if: steps.push.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
